{# Ícono SVG por categoría; se muestra cuando el producto aún no tiene foto. Uso: {% include 'tienda/_icono.html' with categoria=p.categoria %} #}
<svg class="icono" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if categoria == 'perifericos' %}
    <rect x="5" y="16" width="54" height="32" rx="4"/>
    <path d="M12 24h4M20 24h4M28 24h4M36 24h4M44 24h4M52 24h0M12 32h4M20 32h4M28 32h4M36 32h4M44 32h8M16 40h32"/>
  {% elif categoria == 'componentes' %}
    <rect x="16" y="16" width="32" height="32" rx="3"/>
    <rect x="25" y="25" width="14" height="14" rx="1.5"/>
    <path d="M24 8v8M32 8v8M40 8v8M24 48v8M32 48v8M40 48v8M8 24h8M8 32h8M8 40h8M48 24h8M48 32h8M48 40h8"/>
  {% elif categoria == 'redes' %}
    <rect x="8" y="38" width="48" height="14" rx="3"/>
    <path d="M16 45h0M24 45h0M44 45h6M20 38V26M44 38V26"/>
    <path d="M24 20a11 11 0 0 1 16 0M19 15a18 18 0 0 1 26 0"/>
  {% else %}
    <rect x="8" y="14" width="48" height="36" rx="4"/>
    <circle cx="20" cy="26" r="3"/><circle cx="44" cy="38" r="3"/>
    <rect x="28" y="24" width="12" height="12" rx="1.5"/>
    <path d="M14 50v6M22 50v6M30 50v6M38 50v6M46 50v6"/>
  {% endif %}
</svg>
